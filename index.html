<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi Online - UPT SMP Negeri 3 Sutojayan</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- HTML5 QRCode Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .main-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .scanner-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #3b82f6;
            background: #000;
        }
        #reader {
            width: 100%;
        }
        .nav-pills .nav-link {
            color: #94a3b8;
            border-radius: 8px;
            font-weight: 600;
        }
        .nav-pills .nav-link.active {
            background-color: #2563eb;
            color: #ffffff;
        }
        .status-alert {
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary"><i class="fa-solid fa-qrcode me-2"></i>PRESENSI ONLINE SISWA</h2>
            <p class="text-secondary mb-0">UPT SMP Negeri 3 Sutojayan</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="main-card p-4">
                    
                    <!-- Pilihan Mode Presensi (Pagi / Pulang / Dhuhur) -->
                    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="btn-pagi" onclick="setMode('pagi')"><i class="fa-solid fa-sun me-1"></i> Pagi</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="btn-pulang" onclick="setMode('pulang')"><i class="fa-solid fa-house-user me-1"></i> Pulang</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="btn-dhuhur" onclick="setMode('dhuhur')"><i class="fa-solid fa-mosque me-1"></i> Dhuhur</button>
                        </li>
                    </ul>

                    <!-- Area Kamera Pemindai -->
                    <div class="scanner-wrapper mb-3">
                        <div id="reader"></div>
                    </div>

                    <!-- Kotak Notifikasi Hasil Scan -->
                    <div id="notifikasiBox" class="alert alert-info text-center status-alert mb-0" role="alert">
                        <i class="fa-solid fa-camera me-2"></i>Arahkan QR Code ke kamera...
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Script Utama -->
    <script>
        // ====================================================================
        // KONFIGURASI WEB APP URL GOOGLE APPS SCRIPT
        // ====================================================================
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzTGkBxw5d2Y251B0hSMGxa4Dd7-ks-oTqxYY1R0FSqwZmd7ZX4FJCWaar7NWm5WXRjfA/exec";

        let currentMode = "pagi"; // Default mode
        let isScanningActive = true; // Flag pembatas cooldown scan
        let html5QrCode;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            let label = mode === 'pagi' ? 'Pagi/Terlambat' : (mode === 'pulang' ? 'Pulang' : 'Sholat Dhuhur');
            tampilkanNotifikasi(`Mode diubah ke Presensi ${label}. Silakan scan QR...`, "info", "fa-info-circle");
        }

        function onScanSuccess(decodedText, decodedResult) {
            // JIKA SEDANG DALAM COOLDOWN, ABAIKAN SCAN BERIKUTNYA
            if (!isScanningActive) {
                return;
            }

            // Hentikan scan baru sementara
            isScanningActive = false;
            tampilkanNotifikasi("Memproses data presensi...", "warning", "fa-spinner fa-spin");

            // Format QR Code: "7a_AZHILA SILVIA QHONITA"
            let parts = decodedText.split("_");
            let kelasSiswa = parts[0] ? parts[0].trim() : "";
            let namaSiswa = parts.slice(1).join("_") ? parts.slice(1).join("_").trim() : decodedText;

            let jamSekarang = new Date();
            let jam = String(jamSekarang.getHours()).padStart(2, '0') + ":" + String(jamSekarang.getMinutes()).padStart(2, '0');
            let tanggal = jamSekarang.toISOString().split('T')[0];

            let actionTarget = "absen";
            let statusPresensi = "Hadir Tepat Waktu";

            // Penentuan Status berdasarkan Mode & Jam
            if (currentMode === "pagi") {
                actionTarget = "absen";
                if (jamSekarang.getHours() >= 7 && jamSekarang.getMinutes() > 15) {
                    statusPresensi = "Hadir Terlambat";
                }
            } else if (currentMode === "pulang") {
                actionTarget = "absen";
                statusPresensi = "Pulang Tepat Waktu";
            } else if (currentMode === "dhuhur") {
                actionTarget = "absenDhuhur";
                statusPresensi = "Sholat";
            }

            // Kirim payload JSON ke Google Apps Script
            fetch(URL_WEB_APP, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: actionTarget,
                    tanggal: tanggal,
                    jam: jam,
                    kelas: kelasSiswa,
                    nama: namaSiswa,
                    status: statusPresensi
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    // Notifikasi sukses sesuai permintaan
                    tampilkanNotifikasi(`Presensi BERHASIL: ${namaSiswa}`, "success", "fa-circle-check");
                } else if (result.status === "duplicate") {
                    // Notifikasi jika siswa sudah pernah scan hari ini
                    tampilkanNotifikasi(`Anda sudah absen hari ini`, "danger", "fa-triangle-exclamation");
                } else {
                    tampilkanNotifikasi(`Gagal: ${result.message}`, "danger", "fa-circle-xmark");
                }

                // COOLDOWN: Jeda 4 detik sebelum pemindai aktif kembali
                setTimeout(function() {
                    isScanningActive = true;
                    tampilkanNotifikasi("Arahkan QR Code ke kamera...", "info", "fa-camera");
                }, 4000);
            })
            .catch(error => {
                console.error("Error Presensi:", error);
                tampilkanNotifikasi("Kesalahan jaringan/server. Coba lagi.", "danger", "fa-wifi");
                
                // Pulihkan pemindai setelah 2,5 detik jika error
                setTimeout(function() {
                    isScanningActive = true;
                    tampilkanNotifikasi("Arahkan QR Code ke kamera...", "info", "fa-camera");
                }, 2500);
            });
        }

        function tampilkanNotifikasi(pesan, tipe, icon) {
            let box = document.getElementById("notifikasiBox");
            if (box) {
                box.className = `alert alert-${tipe} text-center status-alert mb-0`;
                box.innerHTML = `<i class="fa-solid ${icon} me-2"></i>${pesan}`;
            }
        }

        // Inisialisasi Pemindai Kamera
        document.addEventListener("DOMContentLoaded", function () {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).catch(err => {
                console.error("Kamera Error:", err);
                tampilkanNotifikasi("Akses kamera tidak diizinkan atau tidak ditemukan.", "danger", "fa-video-slash");
            });
        });
    </script>
</body>
</html>
